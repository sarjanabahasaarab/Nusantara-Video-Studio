name: Nusantara Video Studio Official Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Publish Official Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Full Test Suite
        run: npm test

      - name: Build Web Production Assets
        run: npm run build

      - name: Build Windows Tauri Bundle (.exe & .msi)
        run: npm run tauri build

      - name: Package Portable ZIP & Compute SHA-256 Checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts
          
          # Copy NSIS installer
          Get-ChildItem -Path src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination "release-artifacts/Nusantara-Video-Studio-Setup-1.0.0-x64.exe"
          }
          
          # Copy MSI installer
          Get-ChildItem -Path src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination "release-artifacts/Nusantara-Video-Studio-1.0.0-x64.msi"
          }
          
          # Create Portable ZIP from target release binary
          if (Test-Path "src-tauri/target/release/nusantara-video-studio.exe") {
            Compress-Archive -Path "src-tauri/target/release/nusantara-video-studio.exe" -DestinationPath "release-artifacts/Nusantara-Video-Studio-1.0.0-portable-x64.zip" -Force
          }
          
          # Generate SHA-256 Checksums
          cd release-artifacts
          Get-ChildItem | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -FilePath "SHA256SUMS.txt" -Encoding ascii
          }
          cd ..

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Nusantara Video Studio ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
