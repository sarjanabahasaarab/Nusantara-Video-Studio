name: Nusantara Video Studio CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  validate-and-test:
    name: Lint, Typecheck & Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libasound2-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node Dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Lint Codebase
        run: npm run lint

      - name: Run Test Suite (50+ Unit & Integration Tests)
        run: npm test

      - name: Build Web Production Assets
        run: npm run build

  build-windows:
    name: Build Windows Desktop App (Tauri x64)
    needs: validate-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node Dependencies
        run: npm ci

      - name: Rust Unit Tests
        run: |
          cd src-tauri
          cargo test --verbose

      - name: Build Tauri Windows Bundle (.exe & .msi)
        run: npm run tauri build

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nusantara-Video-Studio-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
